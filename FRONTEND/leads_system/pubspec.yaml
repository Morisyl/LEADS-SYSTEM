name: leads_system
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.10.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.10      
  sqflite_common_ffi: ^2.3.0 
  path_provider: ^2.1.2    
  path: ^1.9.0
  http: ^1.2.0             
  desktop_webview_window: ^0.2.3
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/resources/plus_icon.png
    - assets/resources/send_icon.png
    - assets/resources/folder_icon.png
    
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700